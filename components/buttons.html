<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component: Buttons</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="bg-white p-8 space-x-3">

<button class="rounded-lg bg-sky-700 px-5 py-2.5 text-white font-semibold hover:bg-sky-800">Primary</button>
<button class="rounded-lg bg-slate-100 px-5 py-2.5 text-slate-900 font-semibold hover:bg-slate-200">Secondary</button>
<button class="rounded-lg border border-slate-300 px-5 py-2.5 text-slate-700 font-semibold hover:bg-slate-50">Outline</button>
<button class="rounded-lg px-5 py-2.5 text-sky-700 font-semibold hover:bg-slate-50">Ghost</button>
<button class="rounded-full bg-sky-700 px-5 py-2.5 text-white font-semibold hover:bg-sky-800 inline-flex items-center gap-2">
  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>
  Dengan Ikon
</button>
<button disabled class="rounded-lg bg-slate-200 px-5 py-2.5 text-slate-400 font-semibold cursor-not-allowed">Disabled</button>

</body>
</html>
