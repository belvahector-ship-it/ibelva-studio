<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component: Forms</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-50 p-8">

<!-- ================================================================
  VARIAN 1: Form kontak
================================================================= -->
<form class="max-w-md mx-auto bg-white rounded-2xl border border-slate-200 p-6 space-y-4">
  <h3 class="font-semibold text-slate-900">Hubungi Kami</h3>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Nama</label>
    <input type="text" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-600">
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">WhatsApp</label>
    <input type="tel" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-600">
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Kebutuhan</label>
    <select class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-600">
      <option>Paket Statis</option>
      <option>Paket Semi Dinamis</option>
      <option>Paket Full Stack</option>
      <option>Domain saja</option>
    </select>
  </div>
  <div>
    <label class="block text-sm font-medium text-slate-700 mb-1">Pesan</label>
    <textarea rows="3" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-600"></textarea>
  </div>
  <button type="submit" class="w-full rounded-lg bg-sky-700 py-2.5 text-white font-semibold hover:bg-sky-800">Kirim</button>
</form>

</body>
</html>
