<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Component: Navbars</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">

<!-- ================================================================
  VARIAN 1: Navbar simple (logo + link + CTA)
================================================================= -->
<nav class="bg-white border-b border-slate-200">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
    <a href="#" class="text-lg font-bold text-indigo-600">BrandName</a>
    <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
      <a href="#" class="hover:text-indigo-600">Layanan</a>
      <a href="#" class="hover:text-indigo-600">Portofolio</a>
      <a href="#" class="hover:text-indigo-600">Harga</a>
      <a href="#" class="hover:text-indigo-600">Kontak</a>
    </div>
    <a href="#" class="inline-flex items-center rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700">
      Mulai Project
    </a>
  </div>
</nav>

<div class="h-6"></div>

<!-- ================================================================
  VARIAN 2: Navbar sticky + shadow saat scroll (butuh JS kecil)
================================================================= -->
<nav id="sticky-nav" class="sticky top-0 z-40 bg-white/90 backdrop-blur transition-shadow">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 flex items-center justify-between h-16">
    <a href="#" class="text-lg font-bold text-slate-900">BrandName</a>
    <button id="mobile-menu-btn" class="md:hidden p-2 text-slate-600" aria-label="Buka menu">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
    </button>
    <div class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
      <a href="#" class="hover:text-indigo-600">Layanan</a>
      <a href="#" class="hover:text-indigo-600">Portofolio</a>
      <a href="#" class="hover:text-indigo-600">Harga</a>
      <a href="#" class="hover:text-indigo-600">Kontak</a>
    </div>
  </div>
  <div id="mobile-menu" class="hidden md:hidden px-4 pb-4 flex flex-col gap-3 text-sm font-medium text-slate-600">
    <a href="#" class="hover:text-indigo-600">Layanan</a>
    <a href="#" class="hover:text-indigo-600">Portofolio</a>
    <a href="#" class="hover:text-indigo-600">Harga</a>
    <a href="#" class="hover:text-indigo-600">Kontak</a>
  </div>
</nav>

<div class="h-96"></div>

<script>
  document.getElementById('mobile-menu-btn').addEventListener('click', () => {
    document.getElementById('mobile-menu').classList.toggle('hidden');
  });
  window.addEventListener('scroll', () => {
    const nav = document.getElementById('sticky-nav');
    nav.classList.toggle('shadow-md', window.scrollY > 8);
  });
</script>
</body>
</html>
