name: Deploy demos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo-fullstack/package-lock.json

      # demo-statis dan demo-semi-dinamis tidak butuh build (HTML+Tailwind CDN langsung).
      # demo-fullstack butuh build karena pakai Vite + @supabase/supabase-js (ESM bundling).
      - name: Build demo-fullstack
        working-directory: demo-fullstack
        run: |
          npm ci
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r demo-statis _site/
          cp -r demo-semi-dinamis _site/
          cp -r galeri-referensi _site/
          mkdir -p _site/demo-fullstack
          cp -r demo-fullstack/dist/. _site/demo-fullstack/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
