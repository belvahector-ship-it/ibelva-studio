<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation: GSAP Example</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

<section class="py-24 px-4 text-center">
  <h1 id="hero-title" class="text-4xl font-extrabold text-slate-900 opacity-0">Timeline Hero (GSAP)</h1>
  <p id="hero-sub" class="mt-3 text-slate-600 opacity-0">Judul lalu subjudul lalu tombol, berurutan</p>
  <a id="hero-cta" href="#" class="mt-6 inline-block rounded-lg bg-indigo-600 px-6 py-3 text-white font-semibold opacity-0">Mulai Sekarang</a>
</section>

<section class="py-24 px-4 grid grid-cols-4 gap-4 max-w-3xl mx-auto">
  <div class="stagger-box rounded-xl bg-indigo-50 h-20 opacity-0"></div>
  <div class="stagger-box rounded-xl bg-indigo-50 h-20 opacity-0"></div>
  <div class="stagger-box rounded-xl bg-indigo-50 h-20 opacity-0"></div>
  <div class="stagger-box rounded-xl bg-indigo-50 h-20 opacity-0"></div>
</section>

<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
<script>
  gsap.registerPlugin(ScrollTrigger);

  // Timeline hero: judul -> subjudul -> CTA, berurutan begitu halaman load
  gsap.timeline()
    .to('#hero-title', { opacity: 1, y: 0, duration: 0.6, from: { y: 20 } })
    .to('#hero-sub',   { opacity: 1, y: 0, duration: 0.6, from: { y: 20 } }, '-=0.3')
    .to('#hero-cta',   { opacity: 1, y: 0, duration: 0.6, from: { y: 20 } }, '-=0.3');

  // Stagger reveal saat section masuk viewport
  gsap.to('.stagger-box', {
    opacity: 1,
    y: 0,
    duration: 0.5,
    stagger: 0.15,
    scrollTrigger: { trigger: '.stagger-box', start: 'top 85%' }
  });
</script>
</body>
</html>
